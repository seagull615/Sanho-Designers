de:"die Familie||faˈmiːli̯ə|가족|Meine Familie wohnt in Berlin.|우리 가족은 베를린에 산다.\ndas Wasser||ˈvasɐ|물|Ich trinke gern Wasser.|나는 물 마시는 것을 좋아한다.\ndas Buch||buːx|책|Das Buch liegt auf dem Tisch.|책이 탁자 위에 있다.\ndie Schule||ˈʃuːlə|학교|Die Schule beginnt um acht Uhr.|학교는 8시에 시작한다.\nder Freund||fʁɔʏ̯nt|친구|Mein Freund kommt morgen.|내 친구가 내일 온다.\nder Regen||ˈʁeːɡn̩|비|Der Regen hört bald auf.|비가 곧 그친다.\nder Morgen||ˈmɔʁɡn̩|아침|Am Morgen trinke ich Tee.|아침에 나는 차를 마신다.\ndas Haus||haʊ̯s|집|Das Haus ist sehr alt.|그 집은 매우 오래되었다.\ndas Auto||ˈaʊ̯to|자동차|Das Auto ist neu.|그 자동차는 새것이다.\ndas Krankenhaus||ˈkʁaŋkn̩haʊ̯s|병원|Das Krankenhaus ist groß.|그 병원은 크다.",
vi:"gia đình||zaː˧˧ ɗiŋ˨˩|가족|Gia đình tôi có bốn người.|우리 가족은 네 명이다.\nnước||nɨək̚˧˥|물|Tôi uống nước mỗi ngày.|나는 매일 물을 마신다.\nsách||sajk̚˧˥|책|Cuốn sách này rất hay.|이 책은 매우 재미있다.\ntrường học||ʈɨəŋ˨˩ hɔk̚˨|학교|Tôi đến trường học mỗi ngày.|나는 매일 학교에 간다.\nbạn||ɓaːn˨|친구|Bạn tôi rất tốt bụng.|내 친구는 매우 착하다.\nmưa||mɨə˧˧|비|Hôm nay trời mưa.|오늘은 비가 온다.\nbuổi sáng||ɓuəj˧˩ saːŋ˧˥|아침|Buổi sáng tôi uống cà phê.|아침에 나는 커피를 마신다.\nnhà||ɲaː˨˩|집|Nhà tôi ở gần biển.|우리 집은 바다 근처에 있다.\nô tô||ʔo˧˧ to˧˧|자동차|Bố tôi mua một chiếc ô tô mới.|아버지가 새 자동차를 사셨다.\nbệnh viện||ɓɛɲ˨ viən˨|병원|Bệnh viện ở gần ga.|병원은 역 근처에 있다.",
mn:"гэр бүл||ɡɛr pʊɬ|가족|Манай гэр бүл дөрвөн хүнтэй.|우리 가족은 네 명이다.\nус||ʊs|물|Би өдөр бүр ус уудаг.|나는 매일 물을 마신다.\nном||nɔm|책|Энэ ном маш сонирхолтой.|이 책은 매우 재미있다.\nсургууль||sʊrɡuːɬ|학교|Би өдөр бүр сургуульд явдаг.|나는 매일 학교에 간다.\nнайз||naɪt͡s|친구|Миний найз сайхан сэтгэлтэй.|내 친구는 마음이 따뜻하다.\nбороо||pɔrɔː|비|Өнөөдөр бороо орж байна.|오늘은 비가 오고 있다.\nөглөө||ɵɡɬɵː|아침|Би өглөө кофе уудаг.|나는 아침에 커피를 마신다.\nбайшин||paɪʃɪŋ|집|Энэ байшин маш хуучин.|이 집은 매우 오래되었다.\nмашин||maʃɪŋ|자동차|Аав шинэ машин авсан.|아버지가 새 자동차를 샀다.\nэмнэлэг||ɛmnɛɬɛɡ|병원|Эмнэлэг буудлын ойролцоо байдаг.|병원은 역 근처에 있다."
};
const LG=[["ja","🇯🇵 일본어","ja-JP"],["en","🇬🇧 영어","en-US"],["zh","🇨🇳 중국어","zh-CN"],["de","🇩🇪 독일어","de-DE"],["vi","🇻🇳 베트남어","vi-VN"],["mn","🇲🇳 몽골어","mn-MN"]];
const DB={ja:JA.map(a=>({w:a[0],r:a[1],m:a[2],ipa:a[3],ko:a[4],exh:a[5],ek:a[6],say:a[1],html:1}))};
for(const k in D)DB[k]=D[k].split("\n").map(l=>{const a=l.split("|");return{w:a[0],r:a[1],ipa:a[2],m:a[3],ex:a[4],ek:a[5],say:a[4]}});
let cur="ja";const $=id=>document.getElementById(id);
function speak(t,l){try{if(!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(t);u.lang=l;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function tabs(){$("tabs").innerHTML="";LG.forEach(g=>{const b=document.createElement("button");b.className="tab"+(g[0]===cur?" on":"");b.textContent=g[1];b.onclick=()=>{cur=g[0];tabs();render()};$("tabs").appendChild(b)})}
function render(){
  const lang=LG.find(g=>g[0]===cur)[2],arr=DB[cur].slice();
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  $("list").innerHTML="";
  arr.slice(0,10).forEach(e=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML='<div class="pos">명사</div><div class="wl"><span class="w"></span><span class="rd"></span></div><div class="ph"></div><button class="spk">🔊 발음 듣기</button><span class="lab">뜻</span><p class="mean"></p><div class="ex"><div class="t"></div><div class="k"></div></div>';
    c.querySelector(".w").textContent=e.w;
    const hasR=e.r&&cur==="ja";
    if(e.r)c.querySelector(".rd").textContent=hasR?"("+e.r+")":e.r;
    const ph=c.querySelector(".ph");
    if(e.ipa){const d=document.createElement("div");d.innerHTML="<i>IPA</i><span></span>";d.lastChild.textContent="/"+e.ipa+"/";ph.appendChild(d)}
    c.querySelector(".mean").textContent=e.m;
    if(e.html)c.querySelector(".t").innerHTML=e.exh;else c.querySelector(".t").textContent=e.ex;
    c.querySelector(".k").textContent=e.ek;
    c.querySelector(".spk").onclick=()=>speak(e.say,lang);
    $("list").appendChild(c);
  });
  $("list").scrollTo({left:0});
}
$("re").onclick=render;tabs();render();
</script>
</body>
</html>
