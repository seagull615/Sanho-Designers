<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행위-수치(numbered value) 연결기록</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f5f5f2;
        color: #202020;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Noto Sans KR",
            sans-serif;
    }

    .container {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
    }

    h1 {
        margin: 0 0 28px;
        font-size: clamp(24px, 5vw, 36px);
        font-weight: 700;
        letter-spacing: -1px;
    }

    /* ---------- TAB ---------- */

    .tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid #e5e5e1;
    }

    .tab {
        border: none;
        background: transparent;
        padding: 12px 18px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        color: #202020;
        border-bottom: 2px solid #202020;
        margin-bottom: -1px;
        cursor: default;
    }

    /* ---------- PANEL ---------- */

    .panel {
        padding: 28px 0;
    }

    .caption {
        font-size: 13px;
        color: #888;
        line-height: 1.7;
        margin: 0 0 24px;
    }

    /* ---------- NODE ---------- */

    .ref-node {
        background: white;
        border: 1px solid #e5e5e1;
        border-radius: 18px;
        padding: 22px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
    }

    .ref-name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.8px;
    }

    .ref-sub {
        margin-top: 4px;
        font-size: 13px;
        color: #888;
    }

    .ref-value {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -1px;
        color: #bdbdb6;
    }

    .ref-value.set {
        color: #202020;
    }

    .ref-value small {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.3px;
        margin-left: 4px;
        color: #888;
    }

    /* ---------- SECTION ---------- */

    .bill-section {
        margin-top: 28px;
    }

    .section-label {
        font-size: 12px;
        color: #999;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
    }

    .stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 480px) {
        .container {
            padding: 32px 0;
        }

        .ref-node {
            padding: 18px;
        }

        .ref-value {
            font-size: 30px;
        }
    }
</style>
</head>

<body>
<div class="container">

    <h1>행위-수치(numbered value) 연결기록</h1>

    <div class="tabs" role="tablist">
        <button
            class="tab active"
            id="up-reference-tab"
            role="tab"
            aria-selected="true"
            aria-controls="up-reference"
        >
            업레퍼런스
        </button>
    </div>

    <main
        class="panel"
        id="up-reference"
        role="tabpanel"
        aria-labelledby="up-reference-tab"
    >

        <p class="caption">
            제어입력의 레퍼런스. 행위는 적지 않고, 수치만 둔다.
        </p>

        <!-- 목의 각도 -->

        <div class="ref-node">
            <div>
                <div class="ref-name">목의 각도</div>
                <div class="ref-sub">구부정해 보이나, 펴 보이나</div>
            </div>

            <div class="ref-value">—</div>
        </div>

        <!-- 빌 에타 -->

        <section class="bill-section">

            <div class="section-label">NUMBERED VALUE / 01</div>

            <div class="ref-node">
                <div>
                    <div class="ref-name">빌 에타 - 1</div>
                    <div class="ref-sub">행위-수치 연결기록</div>
                </div>

                <div class="ref-value">1</div>
            </div>

        </section>

        <!-- mimi-hangul-french.com 목표치 -->

        <section class="bill-section">

            <div class="section-label">NUMBERED VALUE / 02 · 목표치</div>

            <div class="ref-node">
                <div>
                    <div class="ref-name">유입인구</div>
                    <div class="ref-sub">mimi-hangul-french.com · Google Analytics</div>
                </div>

                <div class="ref-value set">30<small>명</small> · 1<small>분 내외</small></div>
            </div>

        </section>

    </main>

</div>
</body>
</html>
