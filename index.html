<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행위-수치(numbered value) 연결기록</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: #f5f5f2;
        color: #202020;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Noto Sans KR",
            sans-serif;
    }

    .container {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
    }

    h1 {
        margin: 0 0 28px;
        font-size: clamp(24px, 5vw, 36px);
        font-weight: 700;
        letter-spacing: -1px;
    }

    /* ---------- TABS ---------- */
    .tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid #e5e5e1;
    }

    .tab {
        border: none;
        background: transparent;
        padding: 12px 18px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        color: #999;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
    }

    .tab:hover { color: #555; }

    .tab.active {
        color: #202020;
        border-bottom-color: #202020;
    }

    .panel { display: none; padding: 28px 0; }
    .panel.active { display: block; }

    /* ---------- BILL ETA ---------- */
    .caption {
        font-size: 13px;
        color: #888;
        line-height: 1.7;
        margin: 0 0 24px;
    }

    .root-node {
        background: white;
        border: 1px solid #e5e5e1;
        border-radius: 18px;
        padding: 22px 24px;
    }

    .root-name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.8px;
    }

    .root-place {
        margin-top: 4px;
        font-size: 13px;
        color: #888;
    }

    .root-bill {
        margin-top: 16px;
        font-size: 15px;
        color: #555;
    }

    .root-bill b {
        color: #202020;
        font-size: 18px;
        letter-spacing: -0.4px;
    }

    /* skill tree: left spine with branches */
    .branches {
        list-style: none;
        margin: 0;
        padding: 0 0 0 28px;
        position: relative;
    }

    .branches::before {
        content: "";
        position: absolute;
        left: 28px;
        top: 0;
        bottom: 34px;
        width: 2px;
        background: #dcdcd6;
    }

    .branch {
        position: relative;
        padding: 14px 0 0 32px;
    }

    .branch::before {
        content: "";
        position: absolute;
        left: 0;
        top: 44px;
        width: 32px;
        height: 2px;
        background: #dcdcd6;
    }

    .branch::after {
        content: "";
        position: absolute;
        left: -5px;
        top: 39px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #202020;
        border: 2px solid #f5f5f2;
    }

    .branch.pending::after { background: #bdbdb6; }

    .action-node {
        background: white;
        border: 1px solid #e5e5e1;
        border-radius: 14px;
        padding: 16px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
    }

    .branch.pending .action-node {
        border-style: dashed;
        background: transparent;
        color: #999;
    }

    .action-text {
        font-size: 15px;
        line-height: 1.5;
        letter-spacing: -0.3px;
    }

    .eta {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #999;
        white-space: nowrap;
    }

    .eta-track {
        width: 70px;
        height: 6px;
        border-radius: 3px;
        background: #eeeeea;
        overflow: hidden;
    }

    .eta-fill {
        height: 100%;
        width: calc(var(--eta, 0) * 100%);
        background: #202020;
    }

    .eta-value {
        min-width: 28px;
        text-align: right;
        font-weight: 600;
        color: #555;
    }

    /* ---------- UP REFERENCE ---------- */
    .ref-node {
        background: white;
        border: 1px solid #e5e5e1;
        border-radius: 18px;
        padding: 22px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
    }

    .ref-name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.8px;
    }

    .ref-sub {
        margin-top: 4px;
        font-size: 13px;
        color: #888;
    }

    .ref-value {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -1px;
        color: #bdbdb6;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>행위-수치(numbered value) 연결기록</h1>

        <div class="tabs" role="tablist">
            <button class="tab active" data-tab="bill-eta" role="tab">빌 에타</button>
            <button class="tab" data-tab="up-reference" role="tab">업레퍼런스</button>
        </div>

        <div class="panel active" id="bill-eta" role="tabpanel">
            <p class="caption">
                비용을 내고 이용할 때, 어떤 행위가 경험과 가격을 기억에 남게 하는가.<br>
                에타 = 기억률 (0 ~ 1)
            </p>

            <div class="root-node">
                <div class="root-name">세심청</div>
                <div class="root-place">망월사역 사우나</div>
                <div class="root-bill">9,000원 × 2인 = <b>18,000원</b></div>
            </div>

            <ul class="branches">
                <li class="branch">
                    <div class="action-node">
                        <div class="action-text">공용 신발과 내 옷가지를 잘 정돈함</div>
                        <div class="eta">
                            <div class="eta-track"><div class="eta-fill" style="--eta:0"></div></div>
                            <span class="eta-value">—</span>
                        </div>
                    </div>
                </li>
                <li class="branch">
                    <div class="action-node">
                        <div class="action-text">나무 베개에서 악취가 나서 수건을 가져옴</div>
                        <div class="eta">
                            <div class="eta-track"><div class="eta-fill" style="--eta:0"></div></div>
                            <span class="eta-value">—</span>
                        </div>
                    </div>
                </li>
                <li class="branch pending">
                    <div class="action-node">
                        <div class="action-text">그 외 여러 행위</div>
                        <div class="eta">
                            <div class="eta-track"><div class="eta-fill" style="--eta:0"></div></div>
                            <span class="eta-value">—</span>
                        </div>
                    </div>
                </li>
            </ul>
        </div>

        <div class="panel" id="up-reference" role="tabpanel">
            <p class="caption">
                제어입력의 레퍼런스. 행위는 적지 않고, 수치만 둔다.
            </p>

            <div class="ref-node">
                <div>
                    <div class="ref-name">목의 각도</div>
                    <div class="ref-sub">구부정해 보이나, 펴 보이나</div>
                </div>
                <div class="ref-value">—</div>
            </div>
        </div>
    </div>

<script>
    document.querySelectorAll('.tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
            document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
            document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab).classList.add('active');
        });
    });
</script>
</body>
</html>
