<title>영어 · 물리 수치</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--fg:#222;--sub:#888;--line:#eee;--ex:#fafafa;--accent:#222;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--card:#26262a;--fg:#eee;--sub:#9a9a9f;--line:#38383d;--ex:#2e2e33;--accent:#eee;--onacc:#1b1b1d}}
:root[data-theme="dark"]{--bg:#1b1b1d;--card:#26262a;--fg:#eee;--sub:#9a9a9f;--line:#38383d;--ex:#2e2e33;--accent:#eee;--onacc:#1b1b1d}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 96px;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
header{max-width:560px;margin:0 auto 12px;text-align:center}
h1{font-size:21px;margin:0 0 6px}
header p{margin:0;color:var(--sub);font-size:13px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;max-width:560px;margin:0 auto 14px;padding:8px 2px;background:var(--bg)}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;z-index:6;pointer-events:none}
.re{pointer-events:auto;box-shadow:0 6px 20px rgba(0,0,0,.25);border:none;background:var(--accent);color:var(--onacc);font-size:14px;padding:12px 22px;border-radius:999px;cursor:pointer}
#list,#list2,#list3{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 6px 20px;max-width:900px;margin:0 auto;-webkit-overflow-scrolling:touch}
.card{position:relative;flex:0 0 auto;scroll-snap-align:start;width:min(88vw,520px);background:var(--card);border-radius:20px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
[hidden]{display:none!important}
.sec{max-width:900px;margin:10px auto 4px;font-size:16px;padding:0 6px}
.py{font-size:14px;color:var(--sub);margin:-2px 0 6px}
.no{position:absolute;top:18px;right:20px;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.no.done{color:var(--accent);font-weight:700}
.no.ring{top:14px;right:16px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.no.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--card)}
.no.ring b{position:relative;font-size:15px;color:var(--fg)}
.no.ring .tot{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font-size:10px;font-weight:400;white-space:nowrap;color:var(--sub)}
.pos{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--line);font-size:13px;margin-bottom:12px}
.wl{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.w{font-size:32px;font-weight:700;overflow-wrap:anywhere}
.rd{font-size:16px;color:var(--sub)}
.ph{margin:6px 0 14px;font-size:15px;color:var(--sub)}
.ph div{display:flex;gap:8px}
.ph i{font-style:normal;font-size:11px;min-width:34px;opacity:.7;align-self:center}
.spk{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;font-size:13px;padding:7px 16px;cursor:pointer;margin-bottom:14px}
.lab{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.mean{font-size:19px;margin:0;padding-top:14px;border-top:1px solid var(--line)}
.ex{border-left:4px solid var(--accent);padding:10px 16px;margin-top:16px;background:var(--ex);border-radius:0 8px 8px 0}
.ex .t{font-size:17px;margin-bottom:5px;line-height:2.4}
.ex .t rt{font-size:13px;color:var(--sub);user-select:none}
.ex .k{color:var(--sub);font-size:15px}
</style>
</head>

    if(cur==="pe")c.querySelector(".pos").textContent=L==="list2"?"랜덤 인물":L==="list3"?"자유공간 광결합":"광학 영상 연구자";
    if(cur==="ph")c.querySelector(".pos").textContent=L==="list2"?"1~100 µm":L==="list3"?"분해능·정밀도":"물리 수치";
    const nb=document.createElement("span");nb.className="no";nb.textContent=(i+1)+" / "+Math.min(10,src.length)+" · 총 "+src.length+(cur==="ph"?"개":cur==="pe"?"명":"단어");
    if(cur==="ph"){nb.className="no ring";nb.style.setProperty("--p",(i+1)*10);nb.innerHTML="<b>"+(i+1)+"</b><small class=\"tot\">총 "+src.length+"개</small>";c.querySelector(".wl").style.paddingRight="56px"}c.appendChild(nb);c._nb=nb;
    if(e.html)c.querySelector(".t").innerHTML=e.exh;else c.querySelector(".t").textContent=e.ex;
    c.querySelector(".k").textContent=e.ek;
    c.querySelector(".spk").onclick=()=>speak(e.say,lang);
    if(cur==="ph"||cur==="pe")c.querySelector(".spk").remove();
    $(L).appendChild(c);
  });
  $(L).scrollTo({left:0});
  if(window.IntersectionObserver){const io=new IntersectionObserver(es=>es.forEach(x=>{const b=x.target._nb;if(x.isIntersecting&&!b.classList.contains("done")){b.classList.add("done");if(!b.classList.contains("ring"))b.textContent="✓ "+b.textContent}}),{root:$(L),threshold:.6});[...$(L).children].forEach(c=>io.observe(c))}
}
$("re").onclick=render;tabs();render();
</script>
</body>
</html>
