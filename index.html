```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행위-수치(numbered value) 연결기록</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f5f5f2;
        color: #202020;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            "Noto Sans KR",
            sans-serif;
    }

    .container {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
    }

    h1 {
        margin: 0 0 28px;
        font-size: clamp(24px, 5vw, 36px);
        font-weight: 700;
        letter-spacing: -1px;
    }

    /* ---------- TAB ---------- */

    .tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid #e5e5e1;
    }

    .tab {
        border: none;
        background: transparent;
        padding: 12px 18px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        color: #202020;
        border-bottom: 2px solid #202020;
        margin-bottom: -1px;
        cursor: default;
    }

    /* ---------- PANEL ---------- */

    .panel {
        padding: 28px 0;
    }

    .caption {
        font-size: 13px;
        color: #888;
        line-height: 1.7;
        margin: 0 0 24px;
    }

    /* ---------- REFERENCE NODE ---------- */

    .ref-node {
        background: white;
        border: 1px solid #e5e5e1;
        border-radius: 18px;
        padding: 22px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
    }

    .ref-name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.8px;
    }

    .ref-sub {
        margin-top: 4px;
        font-size: 13px;
        color: #888;
    }

    .ref-value {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -1px;
        color: #bdbdb6;
    }

    /* ---------- BILL ETA ---------- */

    .bill-section {
        margin-top: 28px;
    }

    .section-label {
        font-size: 12px;
        color: #999;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
    }

    .root-node {
        background: white;
        border: 1px solid #e5e5e1;
        border-radius: 18px;
        padding: 22px 24px;
    }

    .root-name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.8px;
    }

    .root-place {
        margin-top: 4px;
        font-size: 13px;
        color: #888;
    }

    .root-bill {
        margin-top: 16px;
        font-size: 15px;
        color: #555;
    }

    .root-bill b {
        color: #202020;
        font-size: 18px;
        letter-spacing: -0.4px;
    }

    /* ---------- ACTION TREE ---------- */

    .branches {
        list-style: none;
        margin: 0;
        padding: 0 0 0 28px;
        position: relative;
    }

    .branches::before {
        content: "";
        position: absolute;
        left: 28px;
        top: 0;
        bottom: 34px;
        width: 2px;
        background: #dcdcd6;
    }

    .branch {
        position: relative;
        padding: 14px 0 0 32px;
    }

    .branch::before {
        content: "";
        position: absolute;
        left: 0;
        top: 44px;
        width: 32px;
        height: 2px;
        background: #dcdcd6;
    }

    .branch::after {
        content: "";
        position: absolute;
        left: -5px;
        top: 39px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #202020;
        border: 2px solid #f5f5f2;
    }

    .branch.pending::after {
        background: #bdbdb6;
    }

    .action-node {
        background: white;
        border: 1px solid #e5e5e1;
        border-radius: 14px;
        padding: 16px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
    }

    .branch.pending .action-node {
        border-style: dashed;
        background: transparent;
        color: #999;
    }

    .action-text {
        font-size: 15px;
        line-height: 1.5;
        letter-spacing: -0.3px;
    }

    .eta {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #999;
        white-space: nowrap;
    }

    .eta-track {
        width: 70px;
        height: 6px;
        border-radius: 3px;
        background: #eeeeea;
        overflow: hidden;
    }

    .eta-fill {
        height: 100%;
        width: calc(var(--eta, 0) * 100%);
        background: #202020;
    }

    .eta-value {
        min-width: 28px;
        text-align: right;
        font-weight: 600;
        color: #555;
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 480px) {
        .container {
            padding: 32px 0;
        }

        .root-node,
        .ref-node {
            padding: 18px;
        }

        .action-node {
            padding: 14px;
        }

        .eta-track {
            width: 44px;
        }

        .ref-value {
            font-size: 30px;
        }
    }
</style>
</head>

<body>
<div class="container">

    <h1>행위-수치(numbered value) 연결기록</h1>

    <div class="tabs" role="tablist">
        <button
            class="tab active"
            id="up-reference-tab"
            role="tab"
            aria-selected="true"
            aria-controls="up-reference"
        >
            업레퍼런스
        </button>
    </div>

    <main
        class="panel"
        id="up-reference"
        role="tabpanel"
        aria-labelledby="up-reference-tab"
    >

        <p class="caption">
            제어입력의 레퍼런스. 행위는 적지 않고, 수치만 둔다.
        </p>

        <!-- UP REFERENCE: 목의 각도 -->

        <div class="ref-node">
            <div>
                <div class="ref-name">목의 각도</div>
                <div class="ref-sub">구부정해 보이나, 펴 보이나</div>
            </div>

            <div class="ref-value">—</div>
        </div>

        <!-- BILL ETA - 1 -->

        <section class="bill-section">

            <div class="section-label">NUMBERED VALUE / 01</div>

            <div class="ref-node">
                <div>
                    <div class="ref-name">빌 에타 - 1</div>
                    <div class="ref-sub">행위-수치 연결기록</div>
                </div>

                <div class="ref-value">1</div>
            </div>

            <!-- LOCATION AND BILL -->

            <div class="root-node" style="margin-top: 14px;">

                <div class="root-name">세심청</div>

                <div class="root-place">
                    망월사역 사우나
                </div>

                <div class="root-bill">
                    9,000원 × 2인 = <b>18,000원</b>
                </div>

            </div>

            <!-- ACTION RECORDS -->

            <ul class="branches">

                <li class="branch">
                    <div class="action-node">

                        <div class="action-text">
                            공용 신발과 내 옷가지를 잘 정돈함
                        </div>

                        <div class="eta">
                            <div class="eta-track">
                                <div
                                    class="eta-fill"
                                    style="--eta:0"
                                ></div>
                            </div>

                            <span class="eta-value">—</span>
                        </div>

                    </div>
                </li>

                <li class="branch">
                    <div class="action-node">

                        <div class="action-text">
                            나무 베개에서 악취가 나서 수건을 가져옴
                        </div>

                        <div class="eta">
                            <div class="eta-track">
                                <div
                                    class="eta-fill"
                                    style="--eta:0"
                                ></div>
                            </div>

                            <span class="eta-value">—</span>
                        </div>

                    </div>
                </li>

                <li class="branch pending">
                    <div class="action-node">

                        <div class="action-text">
                            그 외 여러 행위
                        </div>

                        <div class="eta">
                            <div class="eta-track">
                                <div
                                    class="eta-fill"
                                    style="--eta:0"
                                ></div>
                            </div>

                            <span class="eta-value">—</span>
                        </div>

                    </div>
                </li>

            </ul>

        </section>

    </main>

</div>
</body>
</html>
```
