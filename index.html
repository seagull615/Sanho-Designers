const LG=[["ja","🇯🇵 일본어","ja-JP"],["en","🇬🇧 영어","en-US"],["zh","🇨🇳 중국어","zh-CN"],["de","🇩🇪 독일어","de-DE"],["vi","🇻🇳 베트남어","vi-VN"],["mn","🇲🇳 몽골어","mn-MN"]];
const DB={ja:JA.map(a=>({w:a[0],r:a[1],m:a[2],ipa:a[3],ko:a[4],exh:a[5],ek:a[6],say:a[1],html:1}))};
for(const k in D)DB[k]=D[k].split("\n").map(l=>{const a=l.split("|");return{w:a[0],r:a[1],ipa:a[2],m:a[3],ex:a[4],ek:a[5],p:a[6],say:a[0]}});
const ZI={"Манай гэр бүл дөрвөн хүнтэй.":"manaɪ ɡɛr pʊɬ tɵrvɵn xʊntɛɪ","Би өдөр бүр ус уудаг.":"pi ɵtɵr pʊr ʊs ʊːtaɡ","Энэ ном маш сонирхолтой.":"ɛnɛ nɔm maʃ sɔnɪrxɔɬtɔɪ","Би өдөр бүр сургуульд явдаг.":"pi ɵtɵr pʊr sʊrɡuːɬt japtaɡ","Миний найз сайхан сэтгэлтэй.":"mɪnɪ naɪt͡s saɪxaŋ sɛtɡɛɬtɛɪ","Өнөөдөр бороо орж байна.":"ɵnɵːtɵr pɔrɔː ɔrd͡ʒ paɪna","Би өглөө кофе уудаг.":"pi ɵɡɬɵː kɔfɛ ʊːtaɡ","Энэ байшин маш хуучин.":"ɛnɛ paɪʃɪŋ maʃ xʊːt͡ʃɪŋ","Аав шинэ машин авсан.":"aːp ʃɪnɛ maʃɪŋ afsaŋ","Эмнэлэг буудлын ойролцоо байдаг.":"ɛmnɛɬɛɡ pʊːtɬɪŋ ɔɪrɔlt͡sɔː paɪtaɡ"};
const ZP={"我的家庭很幸福。":"Wǒ de jiātíng hěn xìngfú.","请给我一杯水。":"Qǐng gěi wǒ yì bēi shuǐ.","这本书很有意思。":"Zhè běn shū hěn yǒu yìsi.","我每天去学校。":"Wǒ měitiān qù xuéxiào.","他是我的朋友。":"Tā shì wǒ de péngyou.","今天下雨了。":"Jīntiān xià yǔ le.","我早上六点起床。":"Wǒ zǎoshang liù diǎn qǐchuáng.","这个房子很大。":"Zhège fángzi hěn dà.","他开汽车上班。":"Tā kāi qìchē shàngbān.","医院在车站旁边。":"Yīyuàn zài chēzhàn pángbiān."};
const IR={"ɡ":"г","ɛ":"э","r":"р","p":"п","ʊ":"у","ɬ":"л","s":"с","n":"н","ɔ":"о","m":"м","u":"у","ɵ":"о","ɪ":"и","ʃ":"ш","ŋ":"нг","a":"а","k":"к","b":"б","t":"т","d":"д","x":"х","i":"и","l":"л"};
function ipaRu(i){return i.replace(/(.)ː/g,"$1$1").replace(/t͡s/g,"ц").replace(/aɪ/g,"ай").replace(/./gu,c=>IR[c]||c)}
let cur="ja";const $=id=>document.getElementById(id);
function speak(t,l){try{if(!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(t);u.lang=l;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function tabs(){$("tabs").innerHTML="";LG.forEach(g=>{const b=document.createElement("button");b.className="tab"+(g[0]===cur?" on":"");b.textContent=g[1];b.onclick=()=>{cur=g[0];tabs();render()};$("tabs").appendChild(b)})}
function render(){
  const lang=LG.find(g=>g[0]===cur)[2];fill("list",DB[cur],lang);
  const S2={en:["tc","🎬 톰 크루즈 어휘"],de:["rd","👟 루돌프 다슬러 어휘"]}[cur];$("h2").hidden=!S2;$("list2").hidden=!S2;if(S2){$("h2").textContent=S2[1];fill("list2",DB[S2[0]],lang)}
}
function fill(L,src,lang){
  const arr=src.slice();
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  $(L).innerHTML="";
  arr.slice(0,10).forEach((e,i)=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML='<div class="pos">명사</div><div class="wl"><span class="w"></span><span class="rd"></span></div><div class="ph"></div><button class="spk">🔊 발음 듣기</button><span class="lab">뜻</span><p class="mean"></p><div class="ex"><div class="t"></div><div class="k"></div></div>';
    c.querySelector(".w").textContent=e.w;
    c.querySelector(".pos").textContent=e.p?({a:"형용사",n:"명사",m:"수사"}[e.p])+" · "+(L==="list2"?$("h2").textContent.replace(/^\S+\s/,""):"트럼프 어휘"):"명사";
    const hasR=e.r&&cur==="ja";
    if(e.r)c.querySelector(".rd").textContent=hasR?"("+e.r+")":e.r;
    const ph=c.querySelector(".ph");
    if(e.ipa){const d=document.createElement("div");d.innerHTML="<i>IPA</i><span></span>";d.lastChild.textContent="/"+e.ipa+"/";ph.appendChild(d)}
    c.querySelector(".mean").textContent=e.m;
    const nb=document.createElement("span");nb.className="no";nb.textContent=(i+1)+" / 10 · 총 "+src.length+"단어";c.appendChild(nb);c._nb=nb;
    if(e.html)c.querySelector(".t").innerHTML=e.exh;else c.querySelector(".t").textContent=e.ex;
    c.querySelector(".k").textContent=e.ek;
    if(cur==="zh"&&ZP[e.ex]){const q=document.createElement("div");q.className="py";q.textContent=ZP[e.ex];c.querySelector(".t").after(q)}
    if(cur==="mn"&&ZI[e.ex]){const q=document.createElement("div");q.className="py";q.textContent="/"+ZI[e.ex]+"/";c.querySelector(".t").after(q)}
    c.querySelector(".spk").onclick=()=>speak(cur==="mn"?ipaRu(e.ipa):e.say,cur==="mn"?"ru-RU":lang);
    if(cur==="zh"){const b=document.createElement("button");b.className="spk";b.style.marginLeft="8px";b.textContent="🔊 예문 듣기";b.onclick=()=>speak(e.ex,lang);c.querySelector(".spk").after(b)}
    $(L).appendChild(c);
  });
  $(L).scrollTo({left:0});
  if(window.IntersectionObserver){const io=new IntersectionObserver(es=>es.forEach(x=>{const b=x.target._nb;if(x.isIntersecting&&!b.classList.contains("done")){b.classList.add("done");b.textContent="✓ "+b.textContent}}),{root:$(L),threshold:.6});[...$(L).children].forEach(c=>io.observe(c))}
}
$("re").onclick=render;tabs();render();
</script>
